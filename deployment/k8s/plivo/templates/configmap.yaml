apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "plivo.fullname" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "ConnectionStrings": {
        "Tgs": "{{ .Values.connectionStrings.tgs }}"
      },
      "Sms": {
        "RabbitMQUrl": "{{ .Values.rabbit.url }}",
        "UserName": "{{ .Values.rabbit.user }}",
        "Password": "{{ .Values.rabbit.password }}",
        "VirtualHost": "{{ .Values.rabbit.vhost  }}"
      }
    }
